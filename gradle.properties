org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# AGP 9 несёт собственную поддержку Kotlin, но KSP с ней не работает вовсе —
# сборка останавливается с прямым указанием отключить. KSP нужен Room, то
# есть выбора здесь нет: встроенный Kotlin выключен, плагин применяется как
# раньше. Вернуться к встроенному можно будет, когда KSP его освоит.
android.builtInKotlin=false

# Продолжение той же истории: внешний плагин Kotlin не работает с новым DSL
# из AGP 9, а встроенный Kotlin не работает с KSP. Круг замыкается, и выход
# из него один — остаться на прежнем DSL. Сам AGP называет это временным
# обходом; снять оба флага можно будет, когда KSP научится жить со
# встроенным Kotlin.
android.newDsl=false
