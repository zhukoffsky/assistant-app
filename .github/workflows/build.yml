name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon test

      # Единственное место, где вообще запускается lint: локально он требует
      # сети за `lint-gradle`, которого нет в offline-кэше, а собирать проект
      # приходится с `--offline`. Без этого шага проверки вроде `NewApi` не
      # делает никто, и вызов свежего API проходит до устройства незамеченным.
      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      # В лог падения попадает только первая ошибка — остальные придётся
      # искать в отчёте.
      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: magpie-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
